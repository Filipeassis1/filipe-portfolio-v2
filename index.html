<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filipe Assis - Portfolio</title>
    <link rel="icon" type="image/png" sizes="160x160" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grape+Nuts&family=Instrument+Sans:wght@400;500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          if (sessionStorage.getItem("page-transition") === "1") {
            document.documentElement.dataset.curtain = "enter";
          } else if (!sessionStorage.getItem("intro-played") && /^\/(index\.html)?$/.test(location.pathname)) {
            document.documentElement.dataset.curtain = "intro";
          }
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
